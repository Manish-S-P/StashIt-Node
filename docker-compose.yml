# Local development services. Start them with: docker compose up -d
services:
  mongo:
    image: mongo:8
    container_name: stashit-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # RustFS imitates Cloudflare R2 locally: both speak the S3 API.
  storage:
    image: rustfs/rustfs:latest
    container_name: stashit-storage
    ports:
      - "9000:9000" # S3 API (the backend and the browser talk to this)
      - "9001:9001" # Web console: http://localhost:9001
    environment:
      RUSTFS_ACCESS_KEY: stashit-dev
      RUSTFS_SECRET_KEY: stashit-dev-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      # Let the frontend (Vite dev server) upload straight from the browser.
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - storage_data:/data

volumes:
  mongo_data:
  storage_data:
